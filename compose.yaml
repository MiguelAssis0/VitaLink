services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-vitalink}
      POSTGRES_USER: ${DATABASE_USER:-vitalink_demo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_demo_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vitalink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-vitalink}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-vitalink_demo}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-local_demo_only_change_me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@vitalink.local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  vitalink-db:
