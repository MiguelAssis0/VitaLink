server:
  port: 8080
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  application:
    name: vitalink-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vitalink}
    username: ${SPRING_DATASOURCE_USERNAME:demo}
    password: ${SPRING_DATASOURCE_PASSWORD:demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  demo-mode: ${DEMO_MODE:true}
webauthn:
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  allowed-origin: ${WEBAUTHN_ALLOWED_ORIGIN:http://localhost:5173}
notifications:
  zenvia:
    sms:
      enabled: ${ZENVIA_SMS_ENABLED:false}
      api-token: ${ZENVIA_API_TOKEN:}
      sender: ${ZENVIA_SMS_SENDER:}
